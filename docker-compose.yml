services:

  db:
    image: postgres:16
    container_name: projeto_postgres

    environment:
      POSTGRES_DB: projeto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: unless-stopped


volumes:
  postgres_data: