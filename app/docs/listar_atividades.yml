tags:
- Atividades
summary: Listar atividades
description: Disponível para usuario, gestor e admin. Retorna resumos por ID, sem
  questões ou pontuações. Filtros opcionais são combinados. Retorna lista vazia quando
  não houver resultados.
produces:
- application/json
security:
- BearerAuth: []
responses:
  401:
    description: Token ausente/expirado ou usuário inexistente/inativo.
  403:
    description: Perfil sem permissão.
  422:
    description: Token inválido ou diferente de acesso.
  200:
    description: Lista de atividades.
    schema:
      type: array
      items:
        type: object
        properties:
          nome:
            type: string
            maxLength: 200
          descricao:
            type: string
          competencia_id: &id001
            type: integer
            minimum: 1
          habilidade_id: *id001
          dificuldade:
            type: integer
            minimum: 1
            description: ID do nível (1 a 4 no catálogo inicial).
          duracao_min: *id001
          ambiente:
            type: string
            maxLength: 30
            default: qualquer
          tempo:
            type: string
            maxLength: 30
            default: qualquer
          recursos:
            type: string
            maxLength: 30
            default: qualquer
          interlocutores:
            type: string
            maxLength: 30
            default: qualquer
          id: *id001
  400:
    description: Filtro inválido.
    schema:
      type: object
      properties:
        error:
          type: string
parameters:
- in: query
  name: competencia_id
  required: false
  type: integer
  minimum: 1
- in: query
  name: habilidade_id
  required: false
  type: integer
  minimum: 1
- in: query
  name: dificuldade
  required: false
  type: integer
  minimum: 1
